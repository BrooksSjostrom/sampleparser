<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SampLog Parser</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      padding: 2.5rem 3rem;
      max-width: 480px;
      width: 100%;
    }
    h1 {
      color: #1F4E79;
      font-size: 1.6rem;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      color: #666;
      font-size: 0.93rem;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 0.4rem;
    }
    .drop-zone {
      border: 2px dashed #1F4E79;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      color: #1F4E79;
      transition: background 0.2s;
      margin-bottom: 1.2rem;
    }
    .drop-zone:hover, .drop-zone.dragover { background: #e8f0fa; }
    .drop-zone input[type="file"] { display: none; }
    .drop-zone .icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .drop-zone .hint { font-size: 0.85rem; color: #888; margin-top: 0.4rem; }
    #filename { font-size: 0.88rem; color: #375623; margin-top: 0.4rem; min-height: 1.2em; }
    .options { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
    .options label { font-weight: normal; display: flex; align-items: center; gap: 0.35rem; cursor: pointer; }
    .options input[type="radio"] { accent-color: #1F4E79; }
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: #1F4E79;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #163d61; }
    .error {
      background: #FFC7CE;
      color: #C00000;
      border-radius: 6px;
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
    }
    .note {
      font-size: 0.82rem;
      color: #888;
      margin-top: 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SampLog Parser</h1>
    <p class="subtitle">Hach AS950 autosampler log viewer</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/parse" enctype="multipart/form-data" id="upload-form">
      <label>Data Folder</label>
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="icon">📂</div>
        <div>Click to select your <code>Data/</code> folder</div>
        <div class="hint">Selects all files inside — nothing is stored on a server</div>
        <input type="file" name="datafiles" id="file-input" webkitdirectory multiple>
      </div>
      <div id="filename"></div>

      <label style="margin-top:1rem; margin-bottom:0.4rem;">Exports to include</label>
      <div class="options">
        <label><input type="radio" name="exports" value="recent" checked> Most recent only</label>
        <label><input type="radio" name="exports" value="all"> All exports</label>
      </div>

      <button type="submit" class="btn">Parse &amp; View</button>
    </form>

    <p class="note">
      Expected folder structure:<br>
      <code>Data/&lt;serial&gt;/&lt;timestamp&gt;/SampLog.bin</code>
    </p>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const filenameEl = document.getElementById('filename');

    fileInput.addEventListener('change', () => {
      if (!fileInput.files.length) { filenameEl.textContent = ''; return; }
      // webkitRelativePath looks like "Data/serial/timestamp/SampLog.bin"
      const folder = fileInput.files[0].webkitRelativePath.split('/')[0];
      const binCount = Array.from(fileInput.files).filter(f => f.name === 'SampLog.bin').length;
      filenameEl.textContent = `✓ ${folder}  (${binCount} SampLog.bin file${binCount !== 1 ? 's' : ''} found)`;
    });
  </script>
</body>
</html>
